<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<title>煲珠公卡牌配方</title>
		<script src="./js/sql-wasm.js"></script>
		<script src="./js/crypto.js"></script>
		<script src="./layui/layui.js"></script>
		<script src="./js/core.js" defer></script>
		<link href="./layui/css/layui.css" rel="stylesheet">
		<link href="./css/core.css" rel="stylesheet">
	</head>
	<body>
		<div class="header">
			<div class="header-bar">
				<div class="header-title">📜 煲珠公卡牌配方</div>
				<button class="layui-btn layui-btn-normal" id="openSearchBtn">
					<i class="layui-icon layui-icon-search"></i>搜索
				</button>
			</div>
			<div class="header-second">
				<span id="version">更新日志</span>
				<button class="layui-btn layui-btn-xs" id="showRemoveBtn">已下架配方</button>
			</div>
		</div>
		<div id="mainContainer">
			<div id="statusIndicator" class="status">
				<i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop" style="font-size: 30px;"></i>
				<p style="margin-top: 10px;">正在加载数据，请稍候……</p>
			</div>
			<div id="showTip"></div>
			<div id="mainFormula" class="layui-row layui-col-space20"></div>
		</div>
		<div class="bottom">
			<p>©2026 版权所有&nbsp;&nbsp;小红书:<a href="https://www.xiaohongshu.com/user/profile/5cea4bbd000000001801b0bf" target="_blank" rel="noopener">@南城小巷</a></p>
		</div>
		<div id="searchFormBox">
			<form class="layui-form" lay-filter="searchFilter">
				<div class="layui-form-item">
					<label class="layui-form-label">搜索配方：</label>
					<div class="layui-input-block">
						<input type="radio" name="searchMode" value="INCLUDE" title="含选中任一卡牌" checked>
						<input type="radio" name="searchMode" value="EXCLUDE" title="不含选中的卡牌">
					</div>
				</div>
				<div class="layui-form-item" style="margin-bottom: 0;">
					<div id="checkboxContainer">卡牌加载中……</div>
				</div>
			</form>
		</div>
	</body>
</html>
